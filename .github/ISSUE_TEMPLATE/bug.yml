name: Bug
description: The instrument crashes, renders wrong, or a test fails.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, browser, Node version, commit
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or screenshot
